# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# CHANGELOG.md and the GitHub release notes are generated from the conventional
# commit history (https://www.conventionalcommits.org), the same way as in the
# sibling risearch project. Release procedure, from a clean main:
#
#   1. bump `project.version` in pyproject.toml
#   2. uvx git-cliff --tag vX.Y.Z --unreleased --prepend CHANGELOG.md
#   3. git commit -am "release: vX.Y.Z" && git tag vX.Y.Z && git push origin main vX.Y.Z
#
# The release workflow renders the same range again (`--latest`) for the
# GitHub release body, so the two never drift. Commits that are not
# conventional (merge commits, old history) are left out; `release:` commits
# are skipped on purpose.

[changelog]
# Everything above the marker is rewritten from `header` on every `--prepend`;
# hand-written sections below it (0.1.0 and earlier) are kept as they are.
header = """
# Changelog

All notable changes to siOFF are recorded here. Sections from 0.1.1 on are
generated by [git-cliff](https://git-cliff.org) from the conventional commit
history (`cliff.toml`); the release workflow publishes the tagged version's
section as the GitHub release notes. The project uses
[Semantic Versioning](https://semver.org/) with pre-release tags while the
`risearch` dependency is itself in alpha.

<!-- git-cliff: end of header -->

"""
header_marker = "<!-- git-cliff: end of header -->"
# A Tera template rendered for each release. Same layout as risearch.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/RTH-tools/siOFF/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true
postprocessors = []

[git]
tag_pattern = "v[0-9].*"
conventional_commits = true
# Merge commits and pre-conventional history are dropped rather than listed as
# noise; a typed commit is the price of a changelog entry.
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = [
    # Squash-merged PRs carry "(#19)" in the subject: turn it into a link.
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/RTH-tools/siOFF/pull/${2}))" },
]
protect_breaking_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    # Packaging and dependency changes matter to users of a PyPI package
    # (pins, extras, floors), so they get their own group instead of "Other".
    { message = "^build", group = "<!-- 7 -->📦 Build" },
    { message = "^release", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore|^ci", group = "<!-- 8 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 9 -->🛡️ Security" },
    { message = "^revert", group = "<!-- 10 -->◀️ Revert" },
    { message = ".*", group = "<!-- 11 -->💼 Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
