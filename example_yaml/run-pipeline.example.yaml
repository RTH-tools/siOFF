# =============================================================================
# siOFF — Orchestrator Configuration
# =============================================================================
# Usage:
#   python scripts/run_pipeline.py --config path/to/this/config.yaml          # local
#   python scripts/run_pipeline.py --config path/to/this/config.yaml --slurm  # Slurm
#   python scripts/run_pipeline.py --config path/to/this/config.yaml --dry-run
#
# All relative paths are resolved relative to this file's directory.
# This example points at the bundled test data so it can be run directly.
# =============================================================================

# Steps to run in order.  index is an optional pre-processing step.
# Default when omitted: [accessibility, off-targets]
steps:
  - accessibility
  - off-targets

# Directory for log files. Default: logs/<timestamp>/ relative to CWD.
# log_dir: logs

# =============================================================================
# Slurm resource settings  (used only with --slurm)
# =============================================================================
# Top-level keys (partition, account) apply to all steps.
# Per-step sub-sections (snake_case) override the built-in resource defaults.
# Built-in defaults: index 1h/8G/4cpu  accessibility 8h/32G/8cpu
#                    off_targets 4h/64G/16cpu
slurm:
  partition: batch
  account: myaccount
  accessibility:
    time: "08:00:00"
    mem: 32G
    cpus_per_task: 8
  off_targets:
    time: "04:00:00"
    mem: 64G
    cpus_per_task: 16

# =============================================================================
# Step: index  (optional — build RIsearch index from a target FASTA)
# =============================================================================
# index:
#   target: ../data/genome.fa
#   output: ../data/genome.idx   # default: <target>.idx


# =============================================================================
# Step: accessibility  (pre-compute accessibility profiles for every record)
# =============================================================================
accessibility:
  fasta: ../examples/data/genome.fa
  output: ./sioff_example_out/accessibility/
  window: 80
  span: 40
  unpaired: 30
  temperature: 37.0
  workers: 1
  # npy (default): the packed uint8 cache off-targets memory-maps,
  # accessibility.{plus,minus}.packed.npy + .packed.npz (4 files, or 2 with
  # --strand +, whatever the number of records);
  # parquet: one {chrom}.accessibility.parquet per record.
  output_format: npy
  # both (default), or + to fold each sequence as given only: for a
  # transcriptome FASTA, with sense_only: true on the off-targets step.
  strand: both

# =============================================================================
# Step: off-targets  (main off-target analysis)
# =============================================================================
off_targets:
  risearch_file: ../examples/data/predictions.out
  transcriptome: ../examples/data/annotation.gtf
  transcriptome_format: gtf
  feature: exon
  expression_metric: RPKM
  # accessibility_dir populated by the accessibility step above
  accessibility_dir: ./sioff_example_out/accessibility/
  # Where the packed cache is read from and built (default:
  # accessibility_dir). Set it when accessibility_dir is read-only or to stage
  # the cache on node-local disk.
  # accessibility_cache_dir: ./sioff_example_out/accessibility_cache/
  output: ./sioff_example_out/off_targets.tsv
  # siRNA table (header: sirna_id, on_target_id, sequence): each siRNA's
  # on-target and guide sequence. Required when alpha/gamma set a pair other
  # than 1,1; optional otherwise.
  # sirna_table: ../examples/data/sirna_table.tsv
  type: gw
  alpha: "1.0"
  gamma: "1.0"
  theta: ""
  # Energy parameter set for the perfect-match energies of E_min: a bundled
  # name (t04, slh04, s95-rna-dna, s95-dna-rna) or a DSM TSV path relative to
  # this file. Use the set the predictions were searched with.
  matrix: t04

# =============================================================================
# Multi-transcriptome fan-out (optional)
# =============================================================================
# Add a top-level `transcriptomes:` list to analyze several genomes/transcriptomes
# in one launch. Each entry is an INDEPENDENT run with its own predictions,
# annotation, and output — Slurm-native: one transcriptome per node, run in
# parallel (each group's off-targets waits only on its OWN upstream jobs). The
# off-target math (Z_s) is unchanged; groups never mix.
#
# The top-level off_targets/accessibility blocks above act as SHARED
# DEFAULTS; each group overrides only its per-group fields:
#   off_targets:            <- shared defaults (alpha/gamma/theta, window/span,
#     alpha: "0.8;1.0"         temperature, siRNA table, type, ...)
#     sirna_table: ../data/sirna_table.tsv   # alpha/gamma != 1 needs it
#     type: gw
#   transcriptomes:         <- one job (pair) per entry; `index` never fans out
#     - name: human           # required — used for job names, logs, default output
#       risearch_file: ../data/human.out
#       transcriptome: ../data/human.gtf
#       accessibility_dir: ../data/human_acc/   # precomputed profiles
#       output: results/human.tsv               # must be unique per group
#     - name: mouse
#       risearch_file: ../data/mouse.out
#       transcriptome: ../data/mouse.gtf
#       accessibility_dir: ../data/mouse_acc/
#       output: results/mouse.tsv
#
# To COMPUTE accessibility per group instead of using precomputed profiles, add
# `accessibility` to `steps` and give each group a `fasta:` plus the
# `accessibility_dir:` to write into — off-targets then waits on that group's
# accessibility job.
