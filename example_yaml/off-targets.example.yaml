# =============================================================================
# siOFF — Complete Configuration Reference
# =============================================================================
# Usage:
#   sioff --config path/to/this/config.yaml
#
# All relative paths are resolved relative to this file's directory.
# Parameters marked [CLI-ONLY] cannot be set here; pass them on the command
# line instead (e.g. --workers 8).
# =============================================================================

# Command to run. Required.
# Options: "off-targets" | "accessibility"
command: off-targets

# Enable rich debug logging globally (overridden by section-level verbose). Default: false
verbose: false

# =============================================================================
# OFF-TARGETS COMMAND
# Required when command: "off-targets"
# =============================================================================
off_targets:

  # ---------------------------------------------------------------------------
  # Input — choose ONE of the two mutually exclusive input modes
  # ---------------------------------------------------------------------------

  # [REQUIRED] Pre-computed RIsearch output: a .tsv/.out.gz/.parquet file, or a
  # folder of them (a file is treated as a folder of one). Every input is split
  # into per-siRNA parts and scored in parallel. The split writes each input
  # again under TMPDIR, so for large runs TMPDIR needs free space about the
  # size of the input.
  risearch_file: ../examples/data/predictions.out

  # The siRNA table: a tab-separated file with the header
  #   sirna_id <TAB> on_target_id <TAB> sequence
  # on_target_id (a transcript or gene ID) may be empty; lines starting with #
  # are skipped. It names each siRNA's on-target and supplies the guide
  # sequence for the perfect-match energy E_min. Required when alpha/gamma set
  # a pair other than 1,1; optional otherwise (without it there is no
  # on-target). Replaces the old on_target_ids key, which is now an error.
  # sirna_table: ../examples/data/sirna_table.tsv

  # ---------------------------------------------------------------------------
  # Transcriptome annotation (optional)
  # ---------------------------------------------------------------------------

  # Transcriptome annotation file: GTF or GFF3 (BED is not supported).
  # Join predictions to gene/transcript features and expression values.
  transcriptome: ../examples/data/annotation.gtf

  # File format for the transcriptome file. Default: "auto".
  # Options: "auto" | "gtf" | "gff3"
  # "auto" distinguishes GTF from GFF3 by the
  # attribute column: GTF writes `key "value";`, GFF3 writes `key=value;`.
  transcriptome_format: gtf

  # Feature type to extract from GTF/GFF3. Default: "exon" ("transcript" with type: tw)
  feature: exon

  # Column / attribute in the annotation file that holds expression values. Default: "RPKM"
  expression_metric: RPKM

  # ---------------------------------------------------------------------------
  # Accessibility profiles — choose ONE source (or omit for energy-only P(OT))
  # ---------------------------------------------------------------------------

  # Directory of accessibility profiles produced by the "sioff accessibility"
  # command: by default the memory-mapped packed cache
  # accessibility.{plus,minus}.packed.npy + .packed.npz, or one
  # {chrom}.accessibility.parquet per record with its output_format: parquet
  # (packed on the first off-targets run). A v0.2.0 per-record
  # {chrom}_{plus,minus}.access.npy cache is still read.
  accessibility_dir: ../examples/data/accessibility

  # Where the cache is read from and, when missing, built
  # (created if absent). Defaults to accessibility_dir itself; set it when the
  # accessibility directory is read-only or to stage the cache on node-local
  # disk. A complete cache here needs no Parquet in accessibility_dir.
  # accessibility_cache_dir: ./accessibility_cache

  # FASTA file for computing accessibility on-the-fly via ViennaRNA.
  # Slower than pre-computed profiles; uses window/span/unpaired parameters below.
  # fasta: ../examples/data/genome.fa

  # ViennaRNA RNAplfold window size (W). Default: 80
  window: 80

  # ViennaRNA RNAplfold maximum base-pair span (L). Default: 40
  span: 40

  # ViennaRNA RNAplfold unpaired probability length (u). Default: 30
  unpaired: 30

  # ---------------------------------------------------------------------------
  # Partition-function parameters
  # Multiple values separated by ";" generate one P_off_target column each.
  # All (alpha, gamma) pairs where alpha ≤ gamma are computed in one Polars pass.
  # ---------------------------------------------------------------------------

  # Alpha/gamma use E_min = min(perfect-match energy of the table's sequence,
  # lowest energy among the hits left after sense_only and the annotation
  # intersection). The baseline alpha = gamma = 1 does not depend on E_min.
  # Pairs with alpha > gamma are skipped and listed; a value used by no pair
  # is an error.
  #
  # Alpha clamping parameter. Constraint: alpha ≤ gamma. Default: "1.0"
  # Example multi-value sweep: "0.8;0.9;1.0"
  alpha: "1.0"

  # Gamma clamping parameter. Default: "1.0"
  # Example multi-value sweep: "0.9;1.0"
  gamma: "1.0"

  # Theta energy-scaling parameter(s). Empty string = disabled. Default: ""
  # Example: "0.5;0.7"
  theta: ""

  # Energy parameter set for the perfect-match energies of E_min: "t04",
  # "slh04", "s95-rna-dna", "s95-dna-rna", or the path of a DSM TSV table
  # (relative to this file). Use the set the predictions were searched with.
  # Default: "t04"
  matrix: t04

  # ---------------------------------------------------------------------------
  # Predictions mode
  # ---------------------------------------------------------------------------

  # Type of RIsearch2 predictions. Default: "gw"
  # "gw" = genome-wide  → intersection uses genomic coordinates + chromosome join
  # "tw" = transcriptome-wide → intersection matches chrom column to transcript_id
  type: gw

  # ---------------------------------------------------------------------------
  # Output
  # ---------------------------------------------------------------------------

  # Path for the main output file. A .tsv, .csv or .parquet suffix is replaced
  # by the one of the output format; any other name gets the extension
  # appended (results.txt -> results.txt.tsv; "out" -> out.tsv, with the
  # .summary files in out/). The run overwrites an earlier table at that
  # path, or removes it when it writes no rows; an argument error leaves it
  # in place. Rows come in one block per siRNA, sorted by P_off_target
  # descending; one .summary file per siRNA is written next to the table.
  output: ./sioff_example_out/off_targets.tsv

  # Add boltzmann_weight*, boltzmann_weight_noacc*, Z_sirna*, Z_sirna_noacc*
  # and E_min to every row of the output table. Default: false
  # Not compatible with the CLI's --summary-only.
  detailed_report: false

  # ---------------------------------------------------------------------------
  # Filtering
  # ---------------------------------------------------------------------------

  # Keep only sense-strand (+) predictions; discard antisense. Default: false
  sense_only: false

  # ---------------------------------------------------------------------------
  # Performance
  # ---------------------------------------------------------------------------

  # Verbose output: DEBUG-level log lines (per-siRNA steps). Default: false
  verbose: false

  # ---------------------------------------------------------------------------
  # CLI-ONLY parameters (cannot be set in YAML — use the command line)
  # ---------------------------------------------------------------------------
  # --sirna-fasta / -s       siRNA FASTA, the query of the in-process search (requires
  #                          --target-fasta; cannot be combined with risearch_file)
  # --target-fasta / --genome  Target FASTA for integrated RIsearch execution
  # --target-index / -idx    Pre-built RIsearch index (speeds up repeated runs)
  # --workers / -j           Number of parallel worker processes (default: CPU count)
  # --output-format          Output format: "tsv" | "csv" | "parquet" (default: tsv); applies to every input
  # --summary-only           Write only .summary files; skip per-prediction output
  # --profile                Print the timing/memory table (one stage, "Split, score and write")
  #                          and the per-siRNA breakdown at run end

# =============================================================================
# ACCESSIBILITY COMMAND
# Required when command: "accessibility"
# Three operating modes (mutually exclusive; see below):
#   1. Full-genome  : --fasta required; profiles written as the packed cache
#   2. Binding-site : --fasta + --risearch-dir/--risearch-file (CLI-only)
#   3. Profiles→Parquet: --profiles-dir + --risearch-dir (CLI-only, no FASTA needed)
# =============================================================================
accessibility:

  # [REQUIRED for full-genome and binding-site modes]
  # Path to genome or transcriptome FASTA file.
  fasta: ../examples/data/genome.fa

  # [REQUIRED] Output directory for accessibility profiles
  output: ./sioff_example_out/accessibility

  # ViennaRNA RNAplfold window size (W). Default: 80
  window: 80

  # ViennaRNA RNAplfold maximum base-pair span (L). Default: 40
  span: 40

  # ViennaRNA RNAplfold unpaired probability length (u). Default: 30
  unpaired: 30

  # Verbose progress output. Default: false
  verbose: false

  # ---------------------------------------------------------------------------
  # CLI-ONLY parameters (cannot be set in YAML — use the command line)
  # ---------------------------------------------------------------------------
  # --workers / -j        Parallel workers for chromosome folding (default: 1)
