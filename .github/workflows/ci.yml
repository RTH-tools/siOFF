name: CI

# When to run: on every pull request, and on direct pushes to main.
on:
  pull_request:
  push:
    branches: [main]

# If new commits arrive on the same PR/branch while a run is in progress,
# cancel the older run — no point testing superseded code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      # --frozen installs exactly what uv.lock pins (risearch included, from PyPI).
      - run: uv sync --frozen --no-group lts
      - name: Ruff lint
        run: uv run --no-sync ruff check src/ tests/ scripts/
      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/ scripts/

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --no-group lts
      # pyrefly config lives in [tool.pyrefly] (checks src/ and scripts/).
      - name: Pyrefly type check
        run: uv run --no-sync pyrefly check

  # The API reference site (zensical.toml, .github/workflows/docs.yml) is built
  # from the docstrings. --strict turns every build warning into a failure, so
  # a docstring mkdocstrings cannot parse, an object `::: sioff...` cannot
  # resolve, or a broken `--8<--` snippet path reddens the PR here instead of
  # breaking the published site after merge.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --group docs --no-group lts
      - name: Build docs (strict)
        run: uv run --no-sync zensical build --strict

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # macOS on the oldest and newest Python. `macos-latest` (Apple Silicon)
        # is the runner risearch itself tests and builds its wheels on, so this
        # covers exactly the platform its published wheel targets. An Intel run
        # (macos-15-intel, risearch built from source) passed once on
        # 2026-09-29 but is not kept: risearch does not test there.
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --frozen resolves the correct per-version dependency set from the
      # single universal uv.lock for this matrix.python-version. On 3.15,
      # viennarna, ncls and pyyaml have no wheels yet and build from source.
      - run: uv sync --frozen --no-group lts
      # risearch comes from PyPI now, so the in-process index/search tests run
      # here too instead of auto-skipping.
      - name: Pytest
        run: uv run --no-sync pytest -q
