name: Docs

# Build the API documentation site from the docstrings (zensical + mkdocstrings,
# configured in zensical.toml) and publish it to GitHub Pages at
# https://rth-tools.github.io/siOFF/.
#
# One-time setup on the repository: Settings -> Pages -> Build and deployment ->
# Source must be "GitHub Actions" (not "Deploy from a branch"), otherwise the
# deploy job fails with a "Not Found"/"Get Pages site failed" error.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; do not cancel an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      # --frozen installs exactly what uv.lock pins; --group docs adds
      # zensical + mkdocstrings-python on top of the default (dev) group.
      - run: uv sync --frozen --group docs --no-group lts
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build site
        run: uv run --no-sync zensical build --clean
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
