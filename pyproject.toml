[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expression + license-files
build-backend = "hatchling.build"

[project]
name = "sioff"
version = "0.2.0"
description = "siOFF — siRNA off-target discovery pipeline for analyzing RIsearch3 predictions"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Lorenzo Favaro", email = "lorenzo@rth.dk" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "biopython",
  "loguru",
  "ncls>=0.0.63",
  "numpy>=2.4.1",
  "omegaconf>=2.3.0",
  # Plain polars, deliberately without the `rtcompat` extra: polars prefers the
  # compat (SSE4-only) runtime over the AVX2 one whenever both are installed,
  # so listing `polars[rtcompat]` here would make every install run the slow
  # runtime. Old CPUs opt in with the `lts-cpu` extra below.
  # Floor 2.0.0 for Python 3.15: 3.15 no longer stores the implicit `None` in
  # `co_consts`, and polars < 2.0 uses that to find the Series methods it
  # forwards to Expr, so on 3.15 `Series.unique()` & co. silently return None.
  "polars>=2.0.0",
  "pyarrow",
  "pyyaml",
  "rich>=14.3.0",
  # Unpinned so the latest release is picked up automatically. While only
  # alphas exist on PyPI, resolvers fall back to pre-releases ("if-necessary"
  # strategy); once a stable release is out, the latest stable wins.
  "risearch",
  "typer",
  "viennaRNA==2.7.2",
]

[project.urls]
Homepage = "https://github.com/RTH-tools/siOFF"
Documentation = "https://rth-tools.github.io/siOFF/"
Repository = "https://github.com/RTH-tools/siOFF"
Issues = "https://github.com/RTH-tools/siOFF/issues"
Changelog = "https://github.com/RTH-tools/siOFF/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# CPUs without AVX2/FMA/BMI2 (e.g. Sandy/Ivy Bridge Xeons): `pip install
# "sioff[lts-cpu]"`. Installs the compat polars runtime, which polars then
# picks by itself; the risearch wheel is a baseline x86-64 build and needs
# nothing else, but its own `lts-cpu` extra is pulled so the two packages
# always agree on the runtime. Same extra name as risearch.
lts-cpu = ["polars[rtcompat]", "risearch[lts-cpu]"]

[project.scripts]
sioff = "sioff.cli:entrypoint"

[dependency-groups]
dev = [
  "pre-commit",
  # Pinned: pyrefly is the blocking type-check gate; an unpinned upgrade could
  # flag new errors and redden CI on an unrelated `uv lock`. Bump deliberately.
  "pyrefly==0.64.1",
  "pytest",
  "ruff",
  "scalene>=2.1.3",
  "ty",
]
# The development server (Xeon E5-2650, no AVX2) needs the compat runtime, and
# uv has no default extras, so a default group carries it: plain `uv sync` and
# `uv run` work there. On a modern machine `uv sync --no-group lts` gives the
# AVX2 runtime (or keep the group and set POLARS_PREFER_PKG=32). CI runs
# `--no-group lts` so it tests what a default install gets.
lts = ["polars[rtcompat]"]
# API documentation site (https://rth-tools.github.io/siOFF/), built from the
# docstrings by zensical + mkdocstrings. Not a default group: install with
# `uv sync --group docs`. Mirrors the sibling risearch project's setup.
docs = [
  "zensical",
  "mkdocstrings-python",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Ruff's stable default rule set (E4, E7, E9, F), spelled out because with
# `preview = true` ruff >= 0.15 would otherwise switch to its much larger
# preview default set. On top of it, gate the docstrings of the public surface:
# `D` (pydocstyle) checks presence and numpy-style layout, `DOC` (pydoclint)
# checks that Parameters/Returns/Raises/Yields sections match the signature
# and body. The API reference site is rendered from these docstrings, so a
# section mkdocstrings cannot parse is a bug.
select = ["E4", "E7", "E9", "F", "D", "DOC"]
# DOC502 flags a "Raises" entry whose exception is not raised by a literal
# `raise` in the same body. `sioff.api` is a thin wrapper that documents the
# exceptions propagating from `sioff.core` (FileNotFoundError, RIsearchError,
# AccessibilityError) — exactly what callers need — so the rule is a false
# positive there. DOC501 (raised but undocumented) stays on.
ignore = ["DOC502"]
# `DOC*` rules are preview-only in ruff. This flag affects the linter only;
# `ruff format` behaviour is unchanged.
preview = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# The docstring gates apply only to the documented public surface
# (src/sioff/api.py, src/sioff/__init__.py, src/sioff/core/*.py). Everything
# else — CLI, services, models, scripts, tests — keeps the default rules only.
"src/sioff/services/**" = ["D", "DOC"]
"src/sioff/commands/**" = ["D", "DOC"]
"src/sioff/cli.py" = ["D", "DOC"]
"src/sioff/config.py" = ["D", "DOC"]
"src/sioff/models.py" = ["D", "DOC"]
"src/sioff/_logging.py" = ["D", "DOC"]
"scripts/**" = ["D", "DOC"]
"tests/**" = ["D", "DOC"]

[tool.pyrefly]
# scripts/ is not packaged (no console script, excluded from the wheel), but it is
# user-facing orchestration and was previously outside every gate — type-checked
# here so it cannot drift.
project-includes = ["src", "scripts"]
# Type-check against the lowest supported version to catch newer-stdlib usage.
python-version = "3.11"
# `risearch` is a compiled extension imported lazily; treat it as `Any` so the
# type check does not depend on its generated stub.
replace-imports-with-any = ["risearch"]

[tool.hatch.build.targets.wheel]
packages = ["src/sioff"]

[tool.uv]
package = true
default-groups = ["dev", "lts"]
